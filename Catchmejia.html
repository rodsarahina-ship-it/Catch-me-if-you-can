<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch them if you can 😛😛</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================================================
   PINK BACKGROUND
========================================================= */

body {
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #fff0f7 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, #ff9fc5 0%, transparent 30%),
        linear-gradient(135deg, #ff8fba, #ffc0d7, #ff9fca);

    background-size: 150% 150%;

    animation: backgroundMove 10s ease-in-out infinite;
}


@keyframes backgroundMove {
    0%, 100% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }
}


/* =========================================================
   TITLE
========================================================= */

#title {
    position: fixed;
    top: 18px;
    left: 0;
    width: 100%;

    text-align: center;

    color: white;

    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 900;

    letter-spacing: 1px;

    text-shadow:
        0 5px 15px
        rgba(160, 30, 80, .35);

    z-index: 100;

    pointer-events: none;

    animation: titleFloat 2.5s ease-in-out infinite;
}


@keyframes titleFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}


#subtitle {
    position: fixed;
    top: 90px;
    left: 0;

    width: 100%;

    text-align: center;

    color: white;

    font-weight: bold;

    opacity: .9;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   RUNNER
========================================================= */

.runner {
    position: fixed;

    width: 170px;
    height: 170px;

    left: 0;
    top: 0;

    z-index: 10;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    transition:
        filter .2s ease;
}


.runner:hover {
    filter:
        brightness(1.05)
        drop-shadow(0 8px 12px rgba(255,255,255,.35));
}


/* =========================================================
   CHARACTER ANIMATION
========================================================= */

.character {
    width: 100%;
    height: 100%;

    animation:
        runningBob
        .28s
        ease-in-out
        infinite
        alternate;
}


@keyframes runningBob {
    from {
        translate: 0 0;
    }

    to {
        translate: 0 -8px;
    }
}


.flip {
    width: 100%;
    height: 100%;

    transform-origin: center;
}


svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* =========================================================
   CAT ANIMATIONS
========================================================= */

.tail {
    transform-origin: center;

    animation:
        tailMove
        .4s
        ease-in-out
        infinite
        alternate;
}


@keyframes tailMove {
    from {
        transform: rotate(-10deg);
    }

    to {
        transform: rotate(15deg);
    }
}


.paw1 {
    transform-origin: center;

    animation:
        pawRun1
        .25s
        infinite
        alternate;
}


.paw2 {
    transform-origin: center;

    animation:
        pawRun2
        .25s
        infinite
        alternate;
}


@keyframes pawRun1 {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(8px);
    }
}


@keyframes pawRun2 {
    from {
        transform: translateY(8px);
    }

    to {
        transform: translateY(0);
    }
}


/* =========================================================
   MESSAGE BUBBLE
========================================================= */

.message {
    position: fixed;

    z-index: 1000;

    transform:
        translateX(-50%);

    padding:
        10px 18px;

    border-radius:
        999px;

    background:
        rgba(255,255,255,.9);

    color:
        #ef4f88;

    font-weight: 900;

    font-size:
        clamp(1rem, 4vw, 1.5rem);

    white-space: nowrap;

    pointer-events: none;

    box-shadow:
        0 10px 25px
        rgba(180,30,90,.25);

    animation:
        messageFly
        2.5s
        ease-out
        forwards;
}


@keyframes messageFly {

    0% {
        opacity: 0;

        transform:
            translateX(-50%)
            scale(.4);
    }

    15% {
        opacity: 1;

        transform:
            translateX(-50%)
            translateY(-20px)
            scale(1.08);
    }

    30% {
        transform:
            translateX(-50%)
            translateY(-40px)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-50%)
            translateY(-200px)
            scale(.75);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particle {
    position: fixed;

    z-index: 500;

    pointer-events: none;

    animation:
        particleMove
        1.8s
        ease-out
        forwards;
}


@keyframes particleMove {

    from {
        opacity: 1;

        transform:
            translate(0,0)
            scale(.5);
    }

    to {
        opacity: 0;

        transform:
            translate(
                var(--moveX),
                var(--moveY)
            )
            scale(1.5);
    }
}


/* =========================================================
   HINT
========================================================= */

#hint {
    position: fixed;

    bottom: 18px;

    width: 100%;

    text-align: center;

    color: white;

    font-weight: bold;

    z-index: 100;

    pointer-events: none;

    animation:
        hintPulse
        2s
        infinite;
}


@keyframes hintPulse {
    50% {
        opacity: .5;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .runner {
        width: 130px;
        height: 130px;
    }

    #subtitle {
        top: 72px;
        font-size: .8rem;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     TITLE
===================================================== -->

<div id="title">
    Catch them if you can 😛😛
</div>

<div id="subtitle">
    Click them before they escape 💨
</div>


<!-- =====================================================

</div>

<div class="runner" id="creatureRunner">

</div>


<script>


/* =====================================================
   ELEMENTS
===================================================== */

const cat =
    document.getElementById("catRunner");

const creature =
    document.getElementById("creatureRunner");

const catFlip =
    document.getElementById("catFlip");

const creatureFlip =
    document.getElementById("creatureFlip");


/* =====================================================
   MESSAGES

   Sweet + silly + random.
===================================================== */

const messages = [

    /* SWEET */

    "I LOVE YOU JIA ❤️",
    "IMISSYOU 🥹💗",
    "MY BABYYYY 🥹💕",
    "I'M ROD AND IMMMM YOURS 💗",
    "YOU'RE MY FAVORITE PERSON 💕",
    "I CHOOSE YOU 🫵💗",
    "ALWAYS YOU 🥺💕",
    "COME HEREEE 🥹💗",
    "MWAHHHH 💋",
    "MY FAVORITE HUMAN 🥹💗",
    "YOU MAKE ME HAPPY 💕",
    "I LOVE YOU SO MUCH 💗",
    "YOU'RE STUCK WITH ME 🫵💕",
    "I'M SO LUCKY TO HAVE YOU 🥹💗",
    "YOU'RE MY PERSON 💗",
    "I LOVE BEING YOURS 🥺💕",


    /* SILLY */

    "I'M THE PIRATE KING 🏴‍☠️",
    "SET YOUR HEART ABLAZE 🔥",
    "WHY AM I DOING THIS",
    "STOP TOUCHING ME 😭",
    "SNEAK ATTACK 💥",
    "YOU CAN'T CATCH ME 😛",
    "TOO SLOWWW 😛",
    "I'M RUNNING AWAY 💨",
    "WAIT COME BACK 🫵",
    "YOU FOUND ME 😛",
    "AHHHHH",
    "WHO PUT ME HERE",
    "I REGRET NOTHING 🫡",
    "CATCH ME IF YOU CAN 😛😛",
    "HELLO JIAAA 👋",
    "ROD WAS HERE 🫡",
    "NOPE BYEEEE 💨",
    "I'M FAST 😛",
    "SNEAKY SNEAKY 😛"

];


/* =====================================================
   RUNNERS
===================================================== */

const runners = [

    {
        element: cat,
        flip: catFlip,

        x: 40,
        y: 180,

        vx: 2.4,
        vy: 1.7,

        baseSpeed: 2.4
    },

    {
        element: creature,
        flip: creatureFlip,

        x: 300,
        y: 400,

        vx: -2.1,
        vy: 1.5,

        baseSpeed: 2.1
    }

];


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate() {

    runners.forEach(runner => {

        const width =
            runner.element.offsetWidth;

        const height =
            runner.element.offsetHeight;


        const topLimit = 120;

        const bottomLimit =
            window.innerHeight
            -
            height
            -
            60;


        /* MOVE */

        runner.x += runner.vx;

        runner.y += runner.vy;


        /* WALLS */

        if (runner.x <= 0) {

            runner.x = 0;

            runner.vx =
                Math.abs(runner.vx);

        }


        if (
            runner.x + width
            >=
            window.innerWidth
        ) {

            runner.x =
                window.innerWidth
                -
                width;

            runner.vx =
                -Math.abs(runner.vx);

        }


        if (
            runner.y <= topLimit
        ) {

            runner.y =
                topLimit;

            runner.vy =
                Math.abs(runner.vy);

        }


        if (
            runner.y >= bottomLimit
        ) {

            runner.y =
                bottomLimit;

            runner.vy =
                -Math.abs(runner.vy);

        }


        /* APPLY POSITION */

        runner.element.style.left =
            runner.x + "px";

        runner.element.style.top =
            runner.y + "px";


        /* FACE DIRECTION */

        runner.flip.style.transform =

            runner.vx > 0

            ?

            "scaleX(1)"

            :

            "scaleX(-1)";

    });


    requestAnimationFrame(animate);

}


animate();


/* =====================================================
   MESSAGE
===================================================== */

function createMessage(x, y, text) {

    const message =
        document.createElement("div");


    message.className =
        "message";


    message.textContent =
        text ||
        messages[
            Math.floor(
                Math.random()
                *
                messages.length
            )
        ];


    /* Slight random position */

    const randomX =
        Math.random() * 80 - 40;


    message.style.left =
        (x + randomX)
        +
        "px";


    message.style.top =
        y
        +
        "px";


    document.body.appendChild(
        message
    );


    setTimeout(() => {

        message.remove();

    }, 2500);

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount = 12
) {

    const emojis = [

        "💗",
        "💕",
        "💖",
        "❤️",
        "✨",
        "🌸",
        "🥹",
        "🥺"

    ];


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const particle =
            document.createElement("div");


        particle.className =
            "particle";


        particle.textContent =
            emojis[
                Math.floor(
                    Math.random()
                    *
                    emojis.length
                )
            ];


        particle.style.left =
            x + "px";

        particle.style.top =
            y + "px";


        particle.style.fontSize =
            (
                Math.random()
                *
                20
                +
                18
            )
            +
            "px";


        const moveX =
            Math.random()
            *
            260
            -
            130;


        const moveY =
            -(
                Math.random()
                *
                220
                +
                30
            );


        particle.style.setProperty(
            "--moveX",
            moveX + "px"
        );


        particle.style.setProperty(
            "--moveY",
            moveY + "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 1800);

    }

}


/* =====================================================
   CHARACTER CLICK

   MESSAGE + PARTICLES + SPEED BOOST
===================================================== */

function handleCharacterClick(
    event,
    element
) {

    event.preventDefault();

    event.stopPropagation();


    const rect =
        element.getBoundingClientRect();


    const x =
        rect.left
        +
        rect.width / 2;


    const y =
        rect.top
        +
        rect.height / 2;


    createMessage(x, y);

    createParticles(x, y, 14);


    /* FIND RUNNER */

    const runner =
        runners.find(
            r =>
            r.element === element
        );


    /* SPEED BOOST 😛 */

    runner.vx *= 1.8;

    runner.vy *= 1.8;


    /* AFTER A SECOND,
       RETURN TO NORMAL SPEED */

    setTimeout(() => {

        const maxSpeed =
            runner.baseSpeed;


        if (
            Math.abs(runner.vx)
            >
            maxSpeed
        ) {

            runner.vx =
                Math.sign(
                    runner.vx
                )
                *
                maxSpeed;

        }


        if (
            Math.abs(runner.vy)
            >
            1.7
        ) {

            runner.vy =
                Math.sign(
                    runner.vy
                )
                *
                1.7;

        }

    }, 900);

}


/* =====================================================
   CLICK EVENTS
===================================================== */

cat.addEventListener(
    "pointerdown",
    event =>
        handleCharacterClick(
            event,
            cat
        )
);


creature.addEventListener(
    "pointerdown",
    event =>
        handleCharacterClick(
            event,
            creature
        )
);


/* =====================================================
   SNEAK ATTACK

   Every few seconds, one character
   randomly speeds up and shouts it.
===================================================== */

function sneakAttack() {

    const runner =

        runners[
            Math.floor(
                Math.random()
                *
                runners.length
            )
        ];


    const rect =
        runner.element
        .getBoundingClientRect();


    createMessage(

        rect.left
        +
        rect.width / 2,

        rect.top,

        "SNEAK ATTACK 💥"

    );


    runner.vx *= 2;

    runner.vy *= 2;


    setTimeout(() => {

        runner.vx =
            Math.sign(
                runner.vx
            )
            *
            runner.baseSpeed;


        runner.vy =
            Math.sign(
                runner.vy
            )
            *
            1.7;

    }, 900);


    /* Next sneak attack */

    const nextAttack =

        Math.random()
        *
        7000
        +
        6000;


    setTimeout(
        sneakAttack,
        nextAttack
    );

}


/* START SNEAK ATTACKS */

setTimeout(
    sneakAttack,
    5000
);


/* =====================================================
   RANDOM MESSAGES

   Makes them feel alive.
===================================================== */

function randomMessage() {

    const runner =

        runners[
            Math.floor(
                Math.random()
                *
                runners.length
            )
        ];


    const rect =
        runner.element
        .getBoundingClientRect();


    createMessage(

        rect.left
        +
        rect.width / 2,

        rect.top

    );


    const nextMessage =

        Math.random()
        *
        8000
        +
        7000;


    setTimeout(
        randomMessage,
        nextMessage
    );

}


/* START RANDOM MESSAGES */

setTimeout(
    randomMessage,
    8000
);


/* =====================================================
   BACKGROUND CLICK PARTICLES
===================================================== */

document.addEventListener(
    "pointerdown",
    event => {

        if (
            event.target.closest(
                ".runner"
            )
        ) {
            return;
        }


        createParticles(

            event.clientX,

            event.clientY,

            4

        );

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        runners.forEach(
            runner => {

                const width =
                    runner.element
                    .offsetWidth;

                const height =
                    runner.element
                    .offsetHeight;


                runner.x =
                    Math.min(
                        runner.x,
                        window.innerWidth
                        -
                        width
                    );


                runner.y =
                    Math.min(
                        runner.y,
                        window.innerHeight
                        -
                        height
                        -
                        60
                    );

            }
        );

    }
);


</script>

</body>
  </html>
