<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch them if you can 😛😛</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #ffd6e5, transparent 25%),
      radial-gradient(circle at 80% 80%, #ffc1d9, transparent 30%),
      linear-gradient(135deg, #ff8fba, #ffc4d9, #ff9fc5);
    overflow: hidden;
    position: relative;
  }

  /* BACKGROUND HEARTS */

  .bg-heart {
    position: fixed;
    pointer-events: none;
    opacity: 0.35;
    animation: floatBackground linear infinite;
  }

  @keyframes floatBackground {
    from {
      transform: translateY(110vh) rotate(0deg);
    }

    to {
      transform: translateY(-20vh) rotate(360deg);
    }
  }

  /* TITLE */

  #title {
    position: fixed;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;

    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 900;

    color: white;

    text-shadow:
      0 4px 0 #e86c9b,
      0 8px 20px rgba(120, 20, 70, 0.25);

    z-index: 1000;

    pointer-events: none;

    animation: titleBounce 2s ease-in-out infinite;
  }

  @keyframes titleBounce {
    0%, 100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-7px);
    }
  }

  #subtitle {
    position: fixed;
    top: 85px;
    left: 0;

    width: 100%;

    text-align: center;

    color: white;
    font-size: clamp(0.9rem, 3vw, 1.2rem);
    font-weight: bold;

    text-shadow: 0 3px 10px rgba(120, 20, 70, 0.3);

    z-index: 1000;
    pointer-events: none;
  }

  #counter {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.9);

    color: #e85d91;

    padding: 10px 20px;

    border-radius: 30px;

    font-weight: bold;

    box-shadow: 0 8px 25px rgba(180,40,100,0.2);

    z-index: 1000;

    pointer-events: none;
  }

  /* RUNNERS */

  .runner {
    position: fixed;

    width: 150px;
    height: 150px;

    z-index: 100;

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

    transition:
      left 0.35s cubic-bezier(.2,.9,.3,1.3),
      top 0.35s cubic-bezier(.2,.9,.3,1.3);
  }

  .runner:active {
    transform: scale(0.9);
  }

  .character {
    width: 100%;
    height: 100%;

    animation: runningBounce 0.22s infinite alternate ease-in-out;
  }

  @keyframes runningBounce {
    from {
      transform: translateY(0) rotate(-2deg);
    }

    to {
      transform: translateY(-9px) rotate(2deg);
    }
  }

  /* MESSAGE */

  .message {
    position: fixed;

    z-index: 2000;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.95);

    color: #e9508a;

    padding: 10px 18px;

    border-radius: 50px;

    font-size: clamp(1rem, 4vw, 1.45rem);

    font-weight: 900;

    white-space: nowrap;

    pointer-events: none;

    box-shadow:
      0 10px 30px rgba(180, 30, 90, 0.25);

    animation: messagePop 2.5s forwards;
  }

  @keyframes messagePop {
    0% {
      opacity: 0;
      transform:
        translateX(-50%)
        translateY(20px)
        scale(0.4);
    }

    15% {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(-10px)
        scale(1.1);
    }

    25% {
      transform:
        translateX(-50%)
        translateY(-20px)
        scale(1);
    }

    100% {
      opacity: 0;

      transform:
        translateX(-50%)
        translateY(-180px)
        scale(0.8);
    }
  }

  /* PARTICLES */

  .particle {
    position: fixed;

    z-index: 1500;

    pointer-events: none;

    font-size: 24px;

    animation: explode 1.3s forwards ease-out;
  }

  @keyframes explode {
    from {
      opacity: 1;

      transform:
        translate(0, 0)
        scale(0.5)
        rotate(0deg);
    }

    to {
      opacity: 0;

      transform:
        translate(var(--x), var(--y))
        scale(1.4)
        rotate(360deg);
    }
  }

  /* CAT CHARACTER */

  .cat {
    position: relative;

    width: 150px;
    height: 130px;
  }

  .cat-tail {
    position: absolute;

    width: 65px;
    height: 28px;

    background: #858791;

    border-radius: 50%;

    right: -35px;
    bottom: 35px;

    transform-origin: left center;

    animation: tailWag 0.3s infinite alternate ease-in-out;
  }

  @keyframes tailWag {
    from {
      transform: rotate(-20deg);
    }

    to {
      transform: rotate(25deg);
    }
  }

  .cat-body {
    position: absolute;

    width: 115px;
    height: 75px;

    background: #9b9da6;

    border-radius: 50%;

    left: 18px;
    bottom: 0;
  }

  .cat-head {
    position: absolute;

    width: 100px;
    height: 90px;

    background: #a6a8b1;

    border-radius: 50%;

    left: 25px;
    top: 8px;

    z-index: 3;
  }

  .cat-ear {
    position: absolute;

    width: 42px;
    height: 50px;

    background: #a6a8b1;

    top: -12px;

    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  .cat-ear.left {
    left: 2px;
    transform: rotate(-15deg);
  }

  .cat-ear.right {
    right: 2px;
    transform: rotate(15deg);
  }

  .cat-stripe {
    position: absolute;

    width: 6px;
    height: 24px;

    background: #747680;

    border-radius: 10px;

    top: 8px;
  }

  .cat-stripe.one {
    left: 38px;
    transform: rotate(-15deg);
  }

  .cat-stripe.two {
    left: 48px;
  }

  .cat-stripe.three {
    left: 58px;
    transform: rotate(15deg);
  }

  .cat-eye {
    position: absolute;

    width: 7px;
    height: 7px;

    background: #333;

    border-radius: 50%;

    top: 45px;
  }

  .cat-eye.left {
    left: 28px;
  }

  .cat-eye.right {
    right: 28px;
  }

  .cat-nose {
    position: absolute;

    width: 10px;
    height: 7px;

    background: #d983a0;

    border-radius: 50%;

    left: 45px;
    top: 58px;
  }

  .cat-mouth {
    position: absolute;

    width: 22px;
    height: 12px;

    border-bottom: 3px solid #555;

    border-radius: 50%;

    left: 39px;
    top: 58px;
  }

  .cat-cheek {
    position: absolute;

    width: 18px;
    height: 9px;

    background: #ef9ab1;

    border-radius: 50%;

    top: 60px;

    opacity: 0.7;
  }

  .cat-cheek.left {
    left: 8px;
  }

  .cat-cheek.right {
    right: 8px;
  }

  .cat-paw {
    position: absolute;

    width: 30px;
    height: 18px;

    background: #8c8e98;

    border-radius: 50%;

    bottom: -8px;
  }

  .cat-paw.left {
    left: 20px;
    animation: pawRun 0.25s infinite alternate;
  }

  .cat-paw.right {
    right: 20px;
    animation: pawRun 0.25s infinite alternate-reverse;
  }

  @keyframes pawRun {
    from {
      transform: translateY(0);
    }

    to {
      transform: translateY(8px);
    }
  }

  /* CUTE WHITE CHARACTER */

  .cute {
    position: relative;

    width: 145px;
    height: 145px;
  }

  .cute-body {
    position: absolute;

    width: 115px;
    height: 105px;

    background: #fffdf8;

    border: 4px solid #e7ded7;

    border-radius: 48% 48% 45% 45%;

    left: 15px;
    bottom: 8px;
  }

  .cute-ear {
    position: absolute;

    width: 50px;
    height: 55px;

    background: #fffdf8;

    border: 4px solid #e7ded7;

    top: -20px;

    border-radius: 70% 70% 40% 40%;
  }

  .cute-ear.left {
    left: 10px;
    transform: rotate(-25deg);
  }

  .cute-ear.right {
    right: 10px;
    transform: rotate(25deg);
  }

  .cute-eye {
    position: absolute;

    width: 8px;
    height: 13px;

    background: #333;

    border-radius: 50%;

    top: 42px;
  }

  .cute-eye.left {
    left: 35px;
  }

  .cute-eye.right {
    right: 35px;
  }

  .cute-mouth {
    position: absolute;

    width: 16px;
    height: 8px;

    border-bottom: 3px solid #444;

    border-radius: 50%;

    top: 61px;
    left: 47px;
  }

  .cute-cheek {
    position: absolute;

    width: 20px;
    height: 11px;

    background: #ffb4c8;

    border-radius: 50%;

    top: 65px;
  }

  .cute-cheek.left {
    left: 12px;
  }

  .cute-cheek.right {
    right: 12px;
  }

  .cute-paw {
    position: absolute;

    width: 32px;
    height: 20px;

    background: #fffdf8;

    border: 3px solid #e7ded7;

    border-radius: 50%;

    bottom: -10px;
  }

  .cute-paw.left {
    left: 18px;
    animation: cuteRun 0.25s infinite alternate;
  }

  .cute-paw.right {
    right: 18px;
    animation: cuteRun 0.25s infinite alternate-reverse;
  }

  @keyframes cuteRun {
    from {
      transform: translateY(0);
    }

    to {
      transform: translateY(9px);
    }
  }

  /* MOBILE */

  @media (max-width: 600px) {

    .runner {
      width: 120px;
      height: 120px;
    }

    .cat,
    .cute {
      transform: scale(0.8);
      transform-origin: center;
    }

    #subtitle {
      top: 68px;
    }

  }
</style>
</head>

<body>

<h1 id="title">Catch them if you can 😛😛</h1>

<div id="subtitle">
  They're fast... good luck 😛💨
</div>

<div id="counter">
  Caught: <span id="score">0</span> 💖
</div>


<!-- CAT RUNNER -->

<div class="runner" id="catRunner">

  <div class="character">

    <div class="cat">

      <div class="cat-tail"></div>

      <div class="cat-body">

        <div class="cat-paw left"></div>
        <div class="cat-paw right"></div>

      </div>

      <div class="cat-head">

        <div class="cat-ear left"></div>
        <div class="cat-ear right"></div>

        <div class="cat-stripe one"></div>
        <div class="cat-stripe two"></div>
        <div class="cat-stripe three"></div>

        <div class="cat-eye left"></div>
        <div class="cat-eye right"></div>

        <div class="cat-nose"></div>
        <div class="cat-mouth"></div>

        <div class="cat-cheek left"></div>
        <div class="cat-cheek right"></div>

      </div>

    </div>

  </div>

</div>


<!-- CUTE RUNNER -->

<div class="runner" id="cuteRunner">

  <div class="character">

    <div class="cute">

      <div class="cute-body">

        <div class="cute-ear left"></div>
        <div class="cute-ear right"></div>

        <div class="cute-eye left"></div>
        <div class="cute-eye right"></div>

        <div class="cute-mouth"></div>

        <div class="cute-cheek left"></div>
        <div class="cute-cheek right"></div>

        <div class="cute-paw left"></div>
        <div class="cute-paw right"></div>

      </div>

    </div>

  </div>

</div>


<script>

  const cat = document.getElementById("catRunner");
  const cute = document.getElementById("cuteRunner");
  const scoreElement = document.getElementById("score");

  let score = 0;


  /* RANDOM MESSAGES */

  const messages = [

    "I love you Jia 💗",

    "I miss you 🥺",

    "SNEAK ATTACK 😛",

    "I'm the Pirate King 🏴‍☠️",

    "Set your heart ablaze 🔥",

    "Why am I doing this 😭",

    "Stop touching me 😭",

    "I'm Rod and I'mmmm yours 💗",

    "YOU CAUGHT ME 😛",

    "hehehehe 😛",

    "You can't catch me 💨",

    "I love youuu 💕",

    "Come back here 😭",

    "RUNNNN 💨",

    "WAIT FOR ME 🥺",

    "JIAAAA 💗",

    "Rod.exe has escaped 😛",

    "MISSION FAILED SUCCESSFULLY 😭",

    "too slow 😛",

    "SNEAK ATTACK AGAIN 😛",

    "I am speed 💨",

    "okay okay you win 🥺",

    "I love you more 💗",

    "catch me if you can 😛",

    "WHY ARE YOU CLICKING ME 😭",

    "I was just standing here 🥺",

    "I choose you 💕",

    "hehe caught in 4K 😛",

    "surpriseeee 💗"

  ];


  /* MOVE CHARACTER */

  function moveRunner(runner) {

    const width = runner.offsetWidth;
    const height = runner.offsetHeight;

    const padding = 20;

    const minY = 120;

    const maxX =
      window.innerWidth - width - padding;

    const maxY =
      window.innerHeight - height - padding;

    const x =
      Math.random() * Math.max(50, maxX - padding) + padding;

    const y =
      Math.random() *
      Math.max(50, maxY - minY) +
      minY;

    runner.style.left = x + "px";
    runner.style.top = y + "px";

  }


  /* SHOW MESSAGE */

  function showMessage(x, y) {

    const message =
      document.createElement("div");

    message.className = "message";

    message.textContent =
      messages[
        Math.floor(
          Math.random() * messages.length
        )
      ];

    message.style.left = x + "px";
    message.style.top = y + "px";

    document.body.appendChild(message);

    setTimeout(() => {

      message.remove();

    }, 2500);

  }


  /* PARTICLES */

  function createParticles(x, y) {

    const emojis = [
      "💖",
      "💕",
      "✨",
      "🌸",
      "💗"
    ];

    for (let i = 0; i < 12; i++) {

      const particle =
        document.createElement("div");

      particle.className = "particle";

      particle.textContent =
        emojis[
          Math.floor(
            Math.random() *
            emojis.length
          )
        ];

      particle.style.left = x + "px";
      particle.style.top = y + "px";

      const angle =
        Math.random() *
        Math.PI * 2;

      const distance =
        50 +
        Math.random() * 130;

      particle.style.setProperty(
        "--x",
        Math.cos(angle) *
        distance +
        "px"
      );

      particle.style.setProperty(
        "--y",
        Math.sin(angle) *
        distance +
        "px"
      );

      document.body.appendChild(
        particle
      );

      setTimeout(() => {

        particle.remove();

      }, 1300);

    }

  }


  /* CATCH EVENT */

  function catchRunner(event, runner) {

    event.stopPropagation();

    score++;

    scoreElement.textContent = score;

    const rect =
      runner.getBoundingClientRect();

    const x =
      rect.left +
      rect.width / 2;

    const y =
      rect.top +
      rect.height / 2;

    showMessage(x, y);

    createParticles(x, y);

    moveRunner(runner);

  }


  /* CLICK + TOUCH */

  cat.addEventListener(
    "click",
    function(event) {

      catchRunner(
        event,
        cat
      );

    }
  );


  cute.addEventListener(
    "click",
    function(event) {

      catchRunner(
        event,
        cute
      );

    }
  );


  /* MAKE THEM RANDOMLY RUN */

  setInterval(() => {

    moveRunner(cat);

  }, 1600);


  setInterval(() => {

    moveRunner(cute);

  }, 1900);


  /* START POSITIONS */

  moveRunner(cat);
  moveRunner(cute);


  /* BACKGROUND HEARTS */

  function createBackgroundHeart() {

    const heart =
      document.createElement("div");

    heart.className =
      "bg-heart";

    heart.textContent =
      ["💗", "💕", "🌸", "✨"][
        Math.floor(
          Math.random() * 4
        )
      ];

    heart.style.left =
      Math.random() * 100 +
      "vw";

    heart.style.fontSize =
      20 +
      Math.random() * 30 +
      "px";

    heart.style.animationDuration =
      8 +
      Math.random() * 8 +
      "s";

    document.body.appendChild(
      heart
    );

    setTimeout(() => {

      heart.remove();

    }, 16000);

  }


  setInterval(
    createBackgroundHeart,
    900
  );


  /* KEEP CHARACTERS INSIDE SCREEN */

  window.addEventListener(
    "resize",
    () => {

      [cat, cute].forEach(
        runner => {

          const width =
            runner.offsetWidth;

          const height =
            runner.offsetHeight;

          let x =
            parseFloat(
              runner.style.left
            ) || 0;

          let y =
            parseFloat(
              runner.style.top
            ) || 0;

          x = Math.min(
            x,
            window.innerWidth -
            width
          );

          y = Math.min(
            y,
            window.innerHeight -
            height -
            20
          );

          runner.style.left =
            Math.max(0, x) +
            "px";

          runner.style.top =
            Math.max(110, y) +
            "px";

        }
      );

    }
  );

</script>

</body>
</html>
